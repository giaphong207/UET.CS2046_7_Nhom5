feature_reduction:
  k_values:
  - 21
  - 15
  - 10
  - 5
  fit_ranking_on_training_only: true
  primary_goal: AP_full_val - AP_k_val <= 0.01 absolute
  use_test_for_selection: false
  primary_status: IMPLEMENTED
  primary_method: fold-local SelectFromModel
  secondary_qa_method: SelectKBest(f_classif)
  primary_estimator_status: IMPLEMENTED
  importance_type_status: IMPLEMENTED
  deterministic_tie_rule_status: IMPLEMENTED
  fold_feature_names_and_counts_status: IMPLEMENTED
  official_execution_enabled: false
  primary_configuration:
    method: fold-local SelectFromModel
    status: IMPLEMENTED
    scope: PRIMARY
    k_values:
    - 21
    - 15
    - 10
    - 5
    primary_method_implemented: true
    training_cv_performed: true
    estimator: FoldAwareXGB
    estimator_configuration: selected B3 parameters
    weight_mode: balanced
    weight_scope: labels passed to each fit only
    importance_type: gain
    importance_getter: feature_importances_
    threshold: -inf
    prefit: false
    norm_order: 1
    max_features: exact k
    tie_rule: descending unrounded gain; original column order on exact ties
    transform_order: original column order
    fit_scope: each training CV fold; full primary train refit for each k
    cv_interpretation: descriptive conditional on B3 selected using the same training
      CV; not nested CV
    selection_scope: reserved validation AP only
    reference: A2 full-feature
    tolerance_ap: 0.01
    eligibility_numeric_tolerance: 1.0e-12
    fallback: A2 full-feature
    secondary_qa_method: SelectKBest(f_classif)
    secondary_used_for_primary_selection: false
    ordinal_representation: numeric codes; LR scales all inputs
metrics:
  primary: average_precision
  secondary:
  - f2
  - roc_auc
  - precision
  - recall
  - specificity
  - f1
  - accuracy
  - confusion_matrix
  ap_implementation: sklearn.metrics.average_precision_score
uncertainty:
  method: paired_test_bootstrap
  n_resamples: 1000
  confidence_level: 0.95
  comparison: difference in AP
  paired_same_indices: true
  conditional_on_fitted_models: true
  seed: 42
  comparison_pairs:
  - id: B2_minus_B1
    left: B2
    right: B1
  - id: B3_minus_B1
    left: B3
    right: B1
  - id: FINAL_minus_B3
    left: FINAL
    right: B3
  exclusion_policy: Exclude and log single-class draws without replacement
  sign_convention: AP_left - AP_right; positive favors left
  shared_draw_stream_across_pairs: true
  additional_weighting_or_reduction_pairs: PENDING_SEPARATE_APPROVAL
sensitivity:
  duplicate_vector_group_split: separate_sensitivity_design
  group_definition: unique feature vector X only, not respondent ID
  disclose_label_disagreement: true
  outer_design_id: exact-x-group-outer-v3
  outer_method: GroupShuffleSplit 70/30 then 50/50
  outer_ratios_by: groups; row counts approximate
  outer_heldout_evaluation: false
  cv_design_id: exact-x-primary-train-cv-v3
  cv_scope: primary training rows only
  cv_folds: 3
  seed: 42
  cv_methods:
  - StratifiedKFold
  - StratifiedGroupKFold
  cv_std_ddof: 0
  use_for_pipeline_selection: false
  frozen_estimator:
    family: FoldAwareXGB
    parameters:
      n_estimators: 160
      max_depth: 4
      learning_rate: 0.08
      min_child_weight: 1
      subsample: 1.0
      colsample_bytree: 1.0
      reg_lambda: 1.0
      weight_mode: none
      n_jobs: 2
      random_state: 42
optional_extension:
  stacking: false
  optuna_as_search_backend: true
  shap_lime: false
  only_after_core_completed: true
